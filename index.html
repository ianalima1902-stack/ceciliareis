<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#004aad">

  <meta name="description" content="Você é nosso convidado especial!">

  <!-- Prévia de compartilhamento -->
  <meta property="og:title" content="Cecilia Reis | 15 anos">
  <meta property="og:description" content="Você é nosso convidado especial!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://convitececiliareis.umconviteso.com.br/">

  <meta property="og:image" content="https://convitececiliareis.umconviteso.com.br/preview.jpg">
  <meta property="og:image:secure_url" content="https://convitececiliareis.umconviteso.com.br/preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Convite especial de Cecilia Reis - 15 anos">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cecilia Reis | 15 anos">
  <meta name="twitter:description" content="Você é nosso convidado especial!">
  <meta name="twitter:image" content="https://convitececiliareis.umconviteso.com.br/preview.jpg">

  <title>Cecilia Reis | 15 anos</title>

  <style>
    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:#dfe7f1;
      font-family:Arial,sans-serif;
    }

    body{
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .app{
      position:relative;
      width:min(100vw, calc(100vh * 0.54));
      aspect-ratio:1080/2000;
      background:#fff;
      overflow:hidden;
    }

    .page{
      position:absolute;
      inset:0;
      display:none;
    }

    .page.active{
      display:block;
    }

    .art{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:fill;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    .hotspot,
    .linkspot{
      position:absolute;
      z-index:20;
      display:block;
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      outline:none !important;
      box-shadow:none !important;
    }

    .hotspot:focus,
    .hotspot:active,
    .hotspot:focus-visible,
    .linkspot:focus,
    .linkspot:active,
    .linkspot:focus-visible{
      outline:none !important;
      box-shadow:none !important;
    }

    /* CAPA */
    #openInvite{
      left:25%;
      top:41%;
      width:50%;
      height:21%;
      border-radius:50%;
    }

    /* CONVITE PRINCIPAL */
    #musicBtn{
      left:4.5%;
      top:3.2%;
      width:14%;
      height:8%;
      border-radius:50%;
    }

    #manualBtn{
      left:7%;
      top:75.2%;
      width:18%;
      height:10%;
      border-radius:50%;
    }

    #giftBtn{
      left:29%;
      top:75.2%;
      width:18%;
      height:10%;
      border-radius:50%;
    }

    #rsvpBtn{
      left:51%;
      top:75.2%;
      width:18%;
      height:10%;
      border-radius:50%;
    }

    #locationBtn{
      left:73%;
      top:75.2%;
      width:18%;
      height:10%;
      border-radius:50%;
    }

    /* X nas páginas adicionais */
    .closePage{
      position:absolute;
      z-index:30;
      top:1.6%;
      right:2.8%;
      width:9%;
      aspect-ratio:1/1;
      border:1.5px solid #004aad;
      border-radius:50%;
      background:rgba(255,255,255,.92);
      color:#004aad;
      font-family:Arial,sans-serif;
      font-size:28px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    /* Botão copiar Pix */
    #copyPixBtn{
      position:absolute;
      z-index:30;
      left:9%;
      top:82.1%;
      width:39%;
      height:4.7%;
      border:0;
      border-radius:14px;
      background:#004aad;
      color:#fff;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(14px,2.1vw,20px);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .toast{
      position:absolute;
      left:50%;
      bottom:3%;
      transform:translateX(-50%);
      z-index:40;
      background:rgba(0,74,173,.96);
      color:#fff;
      padding:10px 16px;
      border-radius:999px;
      font-size:14px;
      opacity:0;
      pointer-events:none;
      transition:opacity .25s ease;
      white-space:nowrap;
    }

    .toast.show{
      opacity:1;
    }
  </style>
</head>

<body>

<main class="app" aria-label="Convite de 15 anos de Cecilia Reis">

  <!-- CAPA -->
  <section class="page active" id="coverPage">

    <img
      class="art"
      src="capa.png"
      alt="Capa do convite de Cecilia Reis">

    <button
      class="hotspot"
      id="openInvite"
      aria-label="Abrir convite">
    </button>

  </section>

  <!-- CONVITE PRINCIPAL -->
  <section class="page" id="invitePage">

    <img
      class="art"
      src="convite.png"
      alt="Convite principal de Cecilia Reis">

    <button
      class="hotspot"
      id="musicBtn"
      aria-label="Tocar ou pausar música">
    </button>

    <button
      class="hotspot"
      id="manualBtn"
      aria-label="Abrir manual do convidado">
    </button>

    <button
      class="hotspot"
      id="giftBtn"
      aria-label="Abrir sugestões de presente">
    </button>

    <a
      class="linkspot"
      id="rsvpBtn"
      href="https://wa.link/x4yta1"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Confirmar presença pelo WhatsApp">
    </a>

    <a
      class="linkspot"
      id="locationBtn"
      href="https://maps.app.goo.gl/i255TKXXphpAvPEo7"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ver localização">
    </a>

  </section>

  <!-- SUGESTÕES DE PRESENTE -->
  <section class="page" id="giftPage">

    <img
      class="art"
      src="presentes.png"
      alt="Sugestões de presente">

    <button
      id="copyPixBtn"
      aria-label="Copiar chave Pix">
      Copiar chave Pix
    </button>

    <button
      class="closePage"
      data-back
      aria-label="Voltar ao convite">
      ×
    </button>

  </section>

  <!-- MANUAL / COMUNICADO -->
  <section class="page" id="manualPage">

    <img
      class="art"
      src="manual.png"
      alt="Comunicado importante">

    <button
      class="closePage"
      data-back
      aria-label="Voltar ao convite">
      ×
    </button>

  </section>

  <!-- ÁUDIO -->
  <audio id="music" preload="auto" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- AVISO PIX -->
  <div class="toast" id="toast">
    Chave Pix copiada!
  </div>

</main>

<script>

  const pages = {
    cover: document.getElementById('coverPage'),
    invite: document.getElementById('invitePage'),
    gift: document.getElementById('giftPage'),
    manual: document.getElementById('manualPage')
  };

  const music = document.getElementById('music');
  const toast = document.getElementById('toast');

  const pixKey = '608.552.578-81';

  function showPage(page){
    Object.values(pages).forEach(p => {
      p.classList.remove('active');
    });

    page.classList.add('active');
  }

  /* ABRIR CONVITE */
  document
    .getElementById('openInvite')
    .addEventListener('click', () => {
      showPage(pages.invite);
    });

  /* MANUAL */
  document
    .getElementById('manualBtn')
    .addEventListener('click', () => {
      showPage(pages.manual);
    });

  /* PRESENTES */
  document
    .getElementById('giftBtn')
    .addEventListener('click', () => {
      showPage(pages.gift);
    });

  /* VOLTAR AO CONVITE */
  document
    .querySelectorAll('[data-back]')
    .forEach(btn => {

      btn.addEventListener('click', () => {
        showPage(pages.invite);
      });

    });

  /* MÚSICA */
  document
    .getElementById('musicBtn')
    .addEventListener('click', async () => {

      if(music.paused){

        try{
          await music.play();
        }catch(e){}

      }else{

        music.pause();

      }

    });

  /* COPIAR PIX */
  document
    .getElementById('copyPixBtn')
    .addEventListener('click', async () => {

      try{

        await navigator.clipboard.writeText(pixKey);

      }catch(e){

        const input = document.createElement('input');

        input.value = pixKey;

        document.body.appendChild(input);

        input.select();

        document.execCommand('copy');

        input.remove();

      }

      toast.textContent = 'Chave Pix copiada!';

      toast.classList.add('show');

      clearTimeout(window.toastTimer);

      window.toastTimer = setTimeout(() => {

        toast.classList.remove('show');

      }, 2200);

    });

</script>

</body>
</html>
